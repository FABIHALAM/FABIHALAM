<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles for premium fonts and animations -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
    .title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1.5px;
    }
    .subtitle {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 24px;
      fill: #38bdf8;
      letter-spacing: 2px;
    }
    .text-muted {
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .code-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      fill: #64748b;
    }
    .highlight {
      fill: #a78bfa;
      font-weight: 700;
    }
    .grid {
      stroke: rgba(255, 255, 255, 0.03);
      stroke-width: 1;
    }
    .glow-circle {
      filter: blur(80px);
      opacity: 0.15;
    }
    .terminal-box {
      fill: #0b0f19;
      stroke: rgba(255, 255, 255, 0.07);
      stroke-width: 1.5;
      rx: 12px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="20" fill="#030712"/>

  <!-- Radial Glow Accents (Cyberpunk vibe) -->
  <circle cx="100" cy="100" r="250" fill="#3b82f6" class="glow-circle"/>
  <circle cx="1100" cy="300" r="300" fill="#8b5cf6" class="glow-circle"/>
  <circle cx="600" cy="200" r="200" fill="#06b6d4" class="glow-circle" opacity="0.08"/>

  <!-- Subtle Techno Grid Pattern -->
  <g class="grid">
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="255" x2="1200" y2="255" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Left Side: Terminal Graphic -->
  <g transform="translate(80, 80)">
    <!-- Terminal window -->
    <rect width="400" height="240" class="terminal-box"/>
    <!-- Terminal Header & Buttons -->
    <path d="M 0,12 A 12,12 0 0 1 12,0 L 388,0 A 12,12 0 0 1 400,12 L 400,35 L 0,35 Z" fill="#090d16" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#ef4444"/>
    <circle cx="40" cy="18" r="6" fill="#eab308"/>
    <circle cx="60" cy="18" r="6" fill="#22c55e"/>
    <text x="200" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">developer.js</text>

    <!-- Terminal Code Lines -->
    <g transform="translate(25, 45)">
      <text x="0" y="25" class="code-text"><tspan fill="#f43f5e">const</tspan> <tspan fill="#f59e0b">developer</tspan> = {</text>
      <text x="20" y="50" class="code-text">name: <tspan fill="#10b981">"Fabih Alam"</tspan>,</text>
      <text x="20" y="75" class="code-text">role: <tspan fill="#10b981">"MERN Stack Developer"</tspan>,</text>
      <text x="20" y="100" class="code-text">skills: [<tspan fill="#38bdf8">"React"</tspan>, <tspan fill="#38bdf8">"Node"</tspan>, <tspan fill="#38bdf8">"MongoDB"</tspan>],</text>
      <text x="20" y="125" class="code-text">passion: <tspan fill="#10b981">"Building scalable apps"</tspan>,</text>
      <text x="20" y="150" class="code-text">status: <tspan fill="#a78bfa">"Always learning 🚀"</tspan></text>
      <text x="0" y="175" class="code-text">};</text>
    </g>
  </g>

  <!-- Right Side: Profile Info -->
  <g transform="translate(560, 120)">
    <!-- Main Name Title with subtle gradient feel -->
    <text x="0" y="45" class="title">FABIH ALAM</text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="85" class="subtitle">FULL STACK DEVELOPER</text>
    
    <!-- Description -->
    <text x="0" y="125" class="text-muted">BS Software Engineering Student • Specialized in MERN Stack</text>
    <text x="0" y="150" class="text-muted">Creating premium, responsive, and secure web applications.</text>

    <!-- Glowing accent lines underneath -->
    <rect x="0" y="180" width="120" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="130" y="180" width="40" height="4" rx="2" fill="#8b5cf6" opacity="0.8"/>
  </g>

  <!-- Dynamic Tech Icons Elements in Background (Abstract shapes) -->
  <g transform="translate(1060, 60)" opacity="0.2">
    <!-- React Logo style shape -->
    <ellipse cx="40" cy="40" rx="15" ry="40" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(30, 40, 40)"/>
    <ellipse cx="40" cy="40" rx="15" ry="40" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(90, 40, 40)"/>
    <ellipse cx="40" cy="40" rx="15" ry="40" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(150, 40, 40)"/>
    <circle cx="40" cy="40" r="6" fill="#38bdf8"/>
  </g>
</svg>