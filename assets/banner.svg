<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&amp;family=JetBrains+Mono&amp;display=swap');
    
    .name-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .role-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 20px;
      fill: #3b82f6;
      letter-spacing: 4px;
    }
    .desc-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #64748b;
    }
    .tag-box {
      fill: #0f172a;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 1;
      rx: 6px;
    }
    .tag-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #94a3b8;
    }
  </style>

  <!-- Deep minimalist background -->
  <rect width="1200" height="400" rx="20" fill="#090d16"/>
  
  <!-- Sleek gradient accent border at the bottom -->
  <rect x="0" y="395" width="1200" height="5" fill="url(#bottom-grad)"/>

  <defs>
    <linearGradient id="bottom-grad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Clean, vertical line accent on the left -->
  <rect x="70" y="100" width="4" height="200" rx="2" fill="url(#line-grad)"/>

  <!-- Text elements (Left-aligned, clean, human design) -->
  <g transform="translate(100, 100)">
    <!-- Role -->
    <text x="0" y="25" class="role-title">MERN &amp; PYTHON DEVELOPER</text>
    
    <!-- Full Name -->
    <text x="0" y="85" class="name-title">M. FABIH ALAM KHAN</text>
    
    <!-- Description -->
    <text x="0" y="130" class="desc-text">BS Software Engineering Student • Building robust APIs &amp; interactive web architectures.</text>
    
    <!-- Tech Stack minimal tags -->
    <g transform="translate(0, 165)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="80" height="30" class="tag-box"/>
      <text x="40" y="19" text-anchor="middle" class="tag-text">React</text>

      <!-- Tag 2 -->
      <rect x="90" y="0" width="95" height="30" class="tag-box"/>
      <text x="137.5" y="19" text-anchor="middle" class="tag-text">Node.js</text>

      <!-- Tag 3 -->
      <rect x="195" y="0" width="105" height="30" class="tag-box"/>
      <text x="247.5" y="19" text-anchor="middle" class="tag-text">Express</text>

      <!-- Tag 4 -->
      <rect x="310" y="0" width="105" height="30" class="tag-box"/>
      <text x="362.5" y="19" text-anchor="middle" class="tag-text">MongoDB</text>

      <!-- Tag 5 -->
      <rect x="425" y="0" width="80" height="30" class="tag-box"/>
      <text x="465" y="19" text-anchor="middle" class="tag-text">Flask</text>
    </g>
  </g>
</svg>