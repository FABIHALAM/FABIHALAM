<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .name-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 56px;
        fill: #ffffff;
        letter-spacing: -1.5px;
      }
      .role-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #38bdf8;
        letter-spacing: 5px;
      }
      .tagline-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .card-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f1f5f9;
      }
      .card-value {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 20px;
        fill: #34d399;
      }
      .card-label {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #38bdf8;
      }
      .glass-card {
        fill: #090d16;
        fill-opacity: 0.7;
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 1.5;
        rx: 16px;
      }
    </style>

    <!-- Background Gradients -->
    <radialGradient id="mesh-blue" cx="10%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-purple" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-cyan" cx="80%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#334155" fill-opacity="0.4"/>
    </pattern>

    <!-- Card Chart Gradient -->
    <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="20" fill="#030712"/>
  
  <!-- Mesh Gradients Overlay -->
  <rect width="1200" height="400" fill="url(#mesh-blue)"/>
  <rect width="1200" height="400" fill="url(#mesh-purple)"/>
  <rect width="1200" height="400" fill="url(#mesh-cyan)"/>
  
  <!-- Dot Grid Pattern Overlay -->
  <rect width="1200" height="400" fill="url(#dot-grid)"/>

  <!-- Subtle grid highlight line -->
  <line x1="80" y1="0" x2="80" y2="400" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1"/>

  <!-- Left Column: Branding & Info -->
  <g transform="translate(100, 100)">
    <!-- Role Capsule -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>
      <text x="15" y="18" class="badge-text">⚡ FULL STACK DEV</text>
    </g>
    
    <!-- Name -->
    <text x="0" y="80" class="name-text">M. Fabih Alam Khan</text>
    
    <!-- Tagline -->
    <text x="0" y="125" class="tagline-text">BS Software Engineering Student</text>
    <text x="0" y="150" class="tagline-text">Specialized in robust MERN stack applications &amp; Python architectures.</text>

    <!-- Modern tech icons / pills -->
    <g transform="translate(0, 180)" opacity="0.95">
      <!-- MERN pill -->
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#0b0f19" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="20" cy="16" r="4" fill="#61dafb"/>
      <text x="34" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">React &amp; Next</text>

      <!-- Node pill -->
      <rect x="140" y="0" width="115" height="32" rx="6" fill="#0b0f19" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="160" cy="16" r="4" fill="#339933"/>
      <text x="174" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Node &amp; Express</text>

      <!-- DB pill -->
      <rect x="265" y="0" width="105" height="32" rx="6" fill="#0b0f19" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="285" cy="16" r="4" fill="#47a248"/>
      <text x="299" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">MongoDB</text>

      <!-- Python pill -->
      <rect x="380" y="0" width="110" height="32" rx="6" fill="#0b0f19" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="400" cy="16" r="4" fill="#ffde57"/>
      <text x="414" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Flask &amp; SQL</text>
    </g>
  </g>

  <!-- Right Column: Glassmorphic UI Dashboard Card (Visual proof of web UI expertise) -->
  <g transform="translate(680, 80)">
    <!-- Glass card -->
    <rect width="420" height="240" class="glass-card"/>
    
    <!-- Window controls -->
    <circle cx="25" cy="22" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="55" cy="22" r="5" fill="#10b981" opacity="0.8"/>
    
    <text x="210" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#475569">system_monitor.sh</text>

    <!-- Divider -->
    <line x1="0" y1="42" x2="420" y2="42" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5"/>

    <!-- Dashboard Content -->
    <!-- Left KPI -->
    <g transform="translate(25, 65)">
      <text x="0" y="15" class="card-label">API LATENCY</text>
      <text x="0" y="42" class="card-value">12.4 ms</text>
      <text x="0" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#34d399">▲ 98.4% uptime</text>
    </g>

    <!-- Right KPI -->
    <g transform="translate(145, 65)">
      <text x="0" y="15" class="card-label">DB HEALTH</text>
      <text x="0" y="42" class="card-value" fill="#38bdf8">100%</text>
      <text x="0" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#38bdf8">SQLite / Mongo</text>
    </g>
    
    <!-- Interactive Line Chart Mockup -->
    <g transform="translate(25, 145)">
      <!-- Chart grid lines -->
      <line x1="0" y1="0" x2="370" y2="0" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="0" y1="20" x2="370" y2="20" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="0" y1="40" x2="370" y2="40" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="0" y1="60" x2="370" y2="60" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      
      <!-- Chart Area Gradient fill -->
      <path d="M0 50 Q 50 20, 100 45 T 200 15 T 300 35 T 370 10 L 370 65 L 0 65 Z" fill="url(#chart-grad)"/>
      
      <!-- Chart Line path -->
      <path d="M0 50 Q 50 20, 100 45 T 200 15 T 300 35 T 370 10" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Glowing dot on the peak -->
      <circle cx="215" cy="15" r="5" fill="#34d399"/>
      <circle cx="215" cy="15" r="10" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.5"/>
    </g>
  </g>
</svg>