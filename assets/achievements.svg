<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
    .card-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 20px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .card-subtitle {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #94a3b8;
    }
    .card-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
    }
    .card-bg {
      fill: #0b0f19;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 1.5;
      rx: 16px;
      transition: all 0.3s ease;
    }
    .glow {
      filter: blur(25px);
      opacity: 0.15;
    }
  </style>

  <!-- Background Base (Transparent, lets cards stand out) -->
  <rect width="1200" height="260" fill="none"/>

  <!-- ================= CARD 1: MERN DEVELOPER ================= -->
  <g transform="translate(40, 20)">
    <!-- Glow -->
    <rect x="10" y="10" width="240" height="180" fill="#38bdf8" class="glow" rx="16"/>
    <!-- Box -->
    <rect width="260" height="200" class="card-bg"/>
    <!-- Icon Container -->
    <circle cx="130" cy="55" r="30" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <!-- Icon (Code Brackets + React style) -->
    <path d="M120 50 L112 55 L120 60 M140 50 L148 55 L140 60 M128 62 L132 48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text -->
    <text x="130" y="115" text-anchor="middle" class="card-title">MERN Specialist</text>
    <text x="130" y="138" text-anchor="middle" class="card-subtitle">React, Node, Express &amp; Mongo</text>
    <!-- Tag -->
    <rect x="75" y="155" width="110" height="22" rx="11" fill="rgba(56, 189, 248, 0.1)"/>
    <text x="130" y="170" text-anchor="middle" class="card-tag" fill="#38bdf8">EXPERTISE</text>
  </g>

  <!-- ================= CARD 2: SOFTWARE ENGINEERING ================= -->
  <g transform="translate(330, 20)">
    <!-- Glow -->
    <rect x="10" y="10" width="240" height="180" fill="#8b5cf6" class="glow" rx="16"/>
    <!-- Box -->
    <rect width="260" height="200" class="card-bg"/>
    <!-- Icon Container -->
    <circle cx="130" cy="55" r="30" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1"/>
    <!-- Icon (Academic Cap / Shield) -->
    <path d="M130 43 L145 50 L130 57 L115 50 Z" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" fill="rgba(139, 92, 246, 0.2)"/>
    <path d="M120 55 L120 62 C120 65, 130 68, 130 68 C130 68, 140 65, 140 62 L140 55" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text -->
    <text x="130" y="115" text-anchor="middle" class="card-title">Software Engineer</text>
    <text x="130" y="138" text-anchor="middle" class="card-subtitle">BS Software Engineering Student</text>
    <!-- Tag -->
    <rect x="75" y="155" width="110" height="22" rx="11" fill="rgba(139, 92, 246, 0.1)"/>
    <text x="130" y="170" text-anchor="middle" class="card-tag" fill="#a78bfa">EDUCATION</text>
  </g>

  <!-- ================= CARD 3: OPEN SOURCE ================= -->
  <g transform="translate(620, 20)">
    <!-- Glow -->
    <rect x="10" y="10" width="240" height="180" fill="#10b981" class="glow" rx="16"/>
    <!-- Box -->
    <rect width="260" height="200" class="card-bg"/>
    <!-- Icon Container -->
    <circle cx="130" cy="55" r="30" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    <!-- Icon (Globe / Network) -->
    <circle cx="130" cy="55" r="12" stroke="#10b981" stroke-width="2"/>
    <path d="M120 55 H140 M130 45 V65" stroke="#10b981" stroke-width="1.5"/>
    <path d="M122 48 C126 51, 126 59, 122 62 M138 48 C134 51, 134 59, 138 62" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Text -->
    <text x="130" y="115" text-anchor="middle" class="card-title">Open Source</text>
    <text x="130" y="138" text-anchor="middle" class="card-subtitle">Active GitHub Contributor</text>
    <!-- Tag -->
    <rect x="75" y="155" width="110" height="22" rx="11" fill="rgba(16, 185, 129, 0.1)"/>
    <text x="130" y="170" text-anchor="middle" class="card-tag" fill="#10b981">COMMUNITY</text>
  </g>

  <!-- ================= CARD 4: GIT MASTER ================= -->
  <g transform="translate(910, 20)">
    <!-- Glow -->
    <rect x="10" y="10" width="240" height="180" fill="#f59e0b" class="glow" rx="16"/>
    <!-- Box -->
    <rect width="260" height="200" class="card-bg"/>
    <!-- Icon Container -->
    <circle cx="130" cy="55" r="30" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>
    <!-- Icon (Trophy) -->
    <path d="M118 45 H142 M122 45 V52 C122 58, 130 62, 130 62 C130 62, 138 58, 138 52 V45 M130 62 V68 M124 68 H136" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 48 H112 V53 C112 56, 118 56, 118 56 M142 48 H148 V53 C148 56, 142 56, 142 56" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text -->
    <text x="130" y="115" text-anchor="middle" class="card-title">Git Specializations</text>
    <text x="130" y="138" text-anchor="middle" class="card-subtitle">Pull Shark • YOLO • Quickdraw</text>
    <!-- Tag -->
    <rect x="75" y="155" width="110" height="22" rx="11" fill="rgba(245, 158, 11, 0.1)"/>
    <text x="130" y="170" text-anchor="middle" class="card-tag" fill="#f59e0b">ACHIEVEMENTS</text>
  </g>
</svg>
